services:
  docker-api-proxy:
    image: nginx:1.27-alpine
    container_name: docker-api-proxy
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?Define API_KEY en .env}
    # Los workers de nginx corren como 'nginx'; el socket es root:docker (Linux) o root:root
    # (Docker Desktop) con permisos 660. Se agrega 'nginx' al grupo dueño del socket.
    entrypoint:
      - /bin/sh
      - -c
      - |
        gid=$$(stat -c %g /var/run/docker.sock)
        grp=$$(getent group "$$gid" | cut -d: -f1)
        [ -n "$$grp" ] || { grp=dockersock; addgroup -g "$$gid" "$$grp"; }
        addgroup nginx "$$grp" 2>/dev/null || true
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    ports:
      - "${PROXY_PORT:-2376}:2376"
    volumes:
      - ./templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1:2376/_health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
